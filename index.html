<style>
:root {
  color-scheme: dark;
  --ink:#f3e7c8;
  --gold:#d69b43;
  --panel:#151414;
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family: Georgia, "Times New Roman", serif;
  background:
    radial-gradient(circle at 50% 0%, rgba(121,83,27,.24), transparent 34rem),
    linear-gradient(rgba(8,7,7,.9),rgba(8,7,7,.94)),
    repeating-linear-gradient(0deg,#1b1714 0 2px,#120f0e 2px 5px);
}
header {
  text-align:center;
  padding:28px 16px 16px;
  border-bottom:1px solid #51391e;
}
header h1 {
  margin:0;
  font-size:clamp(1.6rem,4vw,3.3rem);
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#fff3d1;
  text-shadow:0 2px 0 #000,0 0 20px #a1662a;
}
header p { margin:.55rem 0 0;color:#c7b89a; }
.board-wrap { overflow-x:auto; padding:18px 12px 42px; }
.board {
  min-width:1160px;
  max-width:1500px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(8,minmax(125px,1fr));
  gap:10px;
  align-items:center;
}
.matchup {
  min-width:0;
  display:grid;
  grid-template-rows:210px 98px 210px;
  gap:8px;
  position:relative;
}
.army-card {
  appearance:none;
  border:2px solid color-mix(in srgb,var(--accent) 80%,#f2c66a);
  border-radius:6px;
  color:white;
  padding:0;
  overflow:hidden;
  cursor:pointer;
  text-align:left;
  position:relative;
  background:
    linear-gradient(145deg, color-mix(in srgb,var(--accent) 75%,#111),#080808 74%);
  box-shadow:0 7px 15px #0009,inset 0 0 24px #0008;
  transition:transform .16s ease,filter .16s ease,box-shadow .16s ease;
}
.army-card::before {
  content:"";
  position:absolute;inset:0;
  background:
   radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--accent) 75%,white) 0 7%,transparent 8%),
   repeating-conic-gradient(from 18deg at 50% 35%,transparent 0 12deg,#ffffff0c 12deg 15deg);
  opacity:.56;
}
.army-card::after {
  content:"VIEW ARMY";
  position:absolute;left:0;right:0;bottom:0;
  padding:8px;
  text-align:center;
  background:#050505d9;
  color:#f2d59b;
  font:700 .72rem/1.1 Arial,sans-serif;
  letter-spacing:.12em;
}
.army-card:hover,.army-card:focus-visible {
  transform:translateY(-5px) scale(1.025);
  filter:brightness(1.18);
  box-shadow:0 12px 24px #000,0 0 0 3px #f5c766;
  outline:none;
  z-index:4;
}
.army-card strong,.army-card small,.team-tag {
  position:relative;z-index:1;display:block;
  text-shadow:0 2px 3px #000;
}
.army-card strong {
  margin:68px 9px 0;
  font-size:1rem;
  text-transform:uppercase;
  line-height:1.05;
}
.army-card small { margin:7px 9px;color:#eadbbf;font:700 .8rem Arial,sans-serif; }
.team-tag {
  position:absolute;top:7px;left:7px;
  padding:4px 6px;border-radius:3px;
  background:#000b;color:#f8dd9e;
  font:700 .61rem Arial,sans-serif;letter-spacing:.08em;
}
.score-panel {
  display:grid;
  grid-template-columns:1fr 28px 1fr;
  align-items:center;
  gap:4px;
  padding:7px;
  border:1px solid #4a3924;
  background:linear-gradient(#241a12,#100e0d);
  box-shadow:inset 0 0 18px #000;
}
.score-panel label { display:grid;gap:4px;text-align:center;font:700 .63rem Arial,sans-serif;color:#d9bd88; }
.score-panel input {
  width:100%;height:54px;border:1px solid #8b6734;border-radius:4px;
  background:#f6eddc;color:#19130e;text-align:center;
  font:700 1.65rem Georgia,serif;
}
.versus { text-align:center;color:#c88a38;font:900 .75rem Arial,sans-serif; }
.preview {
  position:fixed;
  width:min(340px,calc(100vw - 24px));
  z-index:50;
  pointer-events:none;
  display:none;
  padding:13px 15px;
  border:1px solid #d2a85c;
  border-radius:6px;
  background:#111e;
  box-shadow:0 12px 30px #000;
  font:14px/1.35 Arial,sans-serif;
}
.preview strong {color:#ffd788;display:block;font-size:1rem;margin-bottom:5px}
.preview small {color:#bbb}
dialog {
  width:min(830px,94vw);height:min(82vh,900px);
  border:1px solid #c4934d;border-radius:8px;
  padding:0;background:#111;color:#eee;
  box-shadow:0 20px 80px #000;
}
dialog::backdrop {background:#000c;backdrop-filter:blur(3px)}
.modal-head {
  position:sticky;top:0;z-index:2;
  display:flex;justify-content:space-between;gap:20px;align-items:start;
  padding:18px 20px;background:#18130f;border-bottom:1px solid #59401f;
}
.modal-head h2 {margin:0;color:#ffdc9c;font-size:1.35rem}
.modal-head p {margin:.4rem 0 0;color:#baa98c;font:14px Arial,sans-serif}
.close {
  min-width:44px;min-height:40px;border:1px solid #7d6238;border-radius:4px;
  background:#2d2418;color:white;cursor:pointer;font-size:1.3rem;
}
.army-text {
  margin:0;padding:22px;
  white-space:pre-wrap;
  font:15px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;
  color:#f3eadb;
}
footer {text-align:center;padding:0 16px 30px;color:#8f806b;font:13px Arial,sans-serif}
@media(max-width:700px) {
  header p {font-size:.86rem}
  .board-wrap {padding-left:8px;padding-right:8px}
}
</style>

const cards = document.querySelectorAll('.army-card');
const preview = document.getElementById('preview');
const dialog = document.getElementById('armyDialog');
const modalTitle = document.getElementById('modalTitle');
const modalMeta = document.getElementById('modalMeta');
const modalList = document.getElementById('modalList');

cards.forEach(card => {
  const army = armies[Number(card.dataset.index)];
  card.addEventListener('click', () => {
    modalTitle.textContent = army.title;
    modalMeta.textContent = `${army.team} • ${army.faction} • ${army.meta}`;
    modalList.textContent = army.list;
    dialog.showModal();
  });
  card.addEventListener('pointerenter', () => {
    preview.innerHTML = `<strong>${army.title}</strong><div>${army.faction}</div><small>${army.meta}</small>`;
    preview.style.display = 'block';
  });
  card.addEventListener('pointermove', e => {
    const pad = 16;
    const w = preview.offsetWidth, h = preview.offsetHeight;
    preview.style.left = Math.min(e.clientX + pad, innerWidth - w - pad) + 'px';
    preview.style.top = Math.min(e.clientY + pad, innerHeight - h - pad) + 'px';
  });
  card.addEventListener('pointerleave', () => preview.style.display = 'none');
});
document.getElementById('closeDialog').addEventListener('click', () => dialog.close());
dialog.addEventListener('click', e => {
  const r = dialog.getBoundingClientRect();
  if(e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dialog.close();
});

document.querySelectorAll('.score-panel input').forEach((input,i) => {
  const key = 'match-score-' + i;
  input.value = localStorage.getItem(key) || '';
  input.addEventListener('input', () => localStorage.setItem(key,input.value));
});
</script>
